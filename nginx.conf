user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The URLs of the application carry bearer credentials: the participation
    # JWT (?jwt=), the booking confirmation token (/booking/confirmed/<token>),
    # the OIDC code and state of the login callback. Mask them before logging
    # the request line and the Referer.
    map $request_uri $log_uri_booking {
        "~^(?<lub_p>/booking/confirmed/)[^/?#]+(?<lub_r>.*)$" "${lub_p}[Filtered]${lub_r}";
        default $request_uri;
    }

    # Each pass masks the last sensitive parameter not masked yet, hence the chain.
    map $log_uri_booking $log_uri_1 {
        "~*^(?<lu1_a>.*[?&](?:jwt|code|state|session_state|ticket|email|bookingConfirmationToken|access_token|id_token|refresh_token)=)(?!\[Filtered\])[^&]*(?<lu1_b>.*)$" "${lu1_a}[Filtered]${lu1_b}";
        default $log_uri_booking;
    }

    map $log_uri_1 $log_uri_2 {
        "~*^(?<lu2_a>.*[?&](?:jwt|code|state|session_state|ticket|email|bookingConfirmationToken|access_token|id_token|refresh_token)=)(?!\[Filtered\])[^&]*(?<lu2_b>.*)$" "${lu2_a}[Filtered]${lu2_b}";
        default $log_uri_1;
    }

    map $log_uri_2 $log_uri_3 {
        "~*^(?<lu3_a>.*[?&](?:jwt|code|state|session_state|ticket|email|bookingConfirmationToken|access_token|id_token|refresh_token)=)(?!\[Filtered\])[^&]*(?<lu3_b>.*)$" "${lu3_a}[Filtered]${lu3_b}";
        default $log_uri_2;
    }

    map $log_uri_3 $log_uri {
        "~*^(?<lu4_a>.*[?&](?:jwt|code|state|session_state|ticket|email|bookingConfirmationToken|access_token|id_token|refresh_token)=)(?!\[Filtered\])[^&]*(?<lu4_b>.*)$" "${lu4_a}[Filtered]${lu4_b}";
        default $log_uri_3;
    }

    # The Referer is the page the request comes from: drop its query string and
    # fragment, and mask the booking token of its path.
    map $http_referer $log_referer_noquery {
        "~^(?<lrq_p>[^?#]*)[?#]" "${lrq_p}?[Filtered]";
        default $http_referer;
    }

    map $log_referer_noquery $log_referer {
        "~^(?<lr_p>.*/booking/confirmed/)[^/?#]+(?<lr_r>.*)$" "${lr_p}[Filtered]${lr_r}";
        default $log_referer_noquery;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                      '$status $body_bytes_sent "$log_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;
    add_header Cache-Control "no-cache";
    etag on;

    include /etc/nginx/conf.d/cache_env.conf;

    # Origins allowed to frame /intents: the Cozy apps that start the intents.
    # Set at startup from INTENTS_FRAME_ANCESTORS, no framing at all otherwise.
    map $intents_frame_ancestors_env $intents_frame_ancestors {
        ""      "'none'";
        default $intents_frame_ancestors_env;
    }

    server {
      listen 80;

      # Intent services are opened in an iframe by the Cozy app starting the intent
      location = /intents {
        root   /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control $html_cache_control;
        add_header Content-Security-Policy "frame-ancestors $intents_frame_ancestors" always;
      }

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $html_cache_control;
      }

      location = /.env.js {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      }

      location = /version.js {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      }

      # Static assets (JS, CSS, images, fonts, media) can be cached forever because they contain content hashes
      location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control $static_cache_control;
        access_log off;
      }

      error_page   500 502 503 504  /50x.html;

      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }

    gzip_static on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;
}
