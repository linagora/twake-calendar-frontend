# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # rslint-config-cozy-app@0.2.0 requires rstack >=0.8.5 <0.9.0.
      # Dependabot cannot make this conditional on another dependency's version;
      # review this restriction when upgrading rslint-config-cozy-app.
      - dependency-name: rstack
        versions:
          - '<0.8.5'
          - '>=0.9.0'
    groups:
      # twake-ui and twake-libs packages (@linagora/twake-mui, -icons,
      # -oidc, ...): one pull request for all of them, majors included
      twake:
        patterns:
          - '@linagora/*'
      # every other dependency: minor and patch updates in one pull request,
      # each major update in its own
      minor-and-patch:
        update-types:
          - minor
          - patch
