# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # twake-ui and twake-libs packages (@linagora/twake-mui, -icons,
      # -oidc, ...): one pull request for all of them, majors included
      twake:
        patterns:
          - "@linagora/*"
      # every other dependency: minor and patch updates in one pull request,
      # each major update in its own
      minor-and-patch:
        update-types:
          - minor
          - patch
