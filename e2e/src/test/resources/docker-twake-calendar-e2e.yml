networks:
  tcalendar-e2e:
    driver: bridge

services:
  # ----------------------------------------------------------------- frontend
  frontend:
    image: twake-calendar-web-e2e
    networks:
      tcalendar-e2e:
        aliases:
          - frontend
    depends_on:
      - proxy

  # The unauthenticated SPA: booking links, invitation previews, booking confirmations
  public:
    image: twake-calendar-web-public-e2e
    networks:
      tcalendar-e2e:
        aliases:
          - public
    depends_on:
      - proxy

  # Exposes the backend to the browser as http://api and http://dav, with CORS
  proxy:
    image: tcalendar-proxy-e2e
    networks:
      tcalendar-e2e:
        aliases:
          - api
          - dav

  # --------------------------------------------------------------------- OIDC
  sso:
    image: tcalendar-dex-e2e
    command: dex serve /etc/dex/config.yaml
    environment:
      - DEX_EXPAND_ENV=false
      - DEX_SESSIONS_ENABLED=true
    networks:
      tcalendar-e2e:
        aliases:
          - sso

  # ------------------------------------------------------------------ backend
  twake-calendar-side-service:
    image: tcalendar-e2e
    depends_on:
      opensearch:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      ldap:
        condition: service_started
      sabre_dav:
        condition: service_started
      sso:
        condition: service_started
    networks:
      - tcalendar-e2e

  sabre_dav:
    hostname: esn_sabre
    image: sabre-e2e
    environment:
      - SABRE_ENV=dev
      - SABRE_MONGO_HOST=mongo
      - SABRE_MONGO_PORT=27017
      - ESN_MONGO_HOST=mongo
      - ESN_MONGO_PORT=27017
      - ESN_MONGO_DBNAME=esn_docker
      - MONGO_TIMEOUT=100000
      - ESN_HOST=twake-calendar-side-service
      - ESN_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMQP_HOST=rabbitmq
      - AMQP_PORT=5672
      - AMQP_LOGIN=guest
      - AMQP_PASSWORD=guest
      - SABRE_ADMIN_LOGIN=admin
      - SABRE_ADMIN_PASSWORD=secret123
      - OPENPASS_BASIC_AUTH=YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      - LDAP_ADMIN_DN=cn=admin,dc=open-paas.org,dc=lng
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_BASE=ou=users,dc=open-paas.org,dc=lng
      - LDAP_BASE_WITH_MAIL=ou=users,dc=open-paas.org,dc=lng
      - LDAP_SERVER=ldap://esn_ldap:389
      - LDAP_USERNAME_MODE=username
      - LOG_TRACE=true
      - SABRE_IMPERSONATION_ENABLED=true
      - SABRE_EMAIL_VALARM_RECIPIENT_SCHEDULING=true
    networks:
      - tcalendar-e2e

  ldap:
    hostname: esn_ldap
    image: ldap-e2e
    environment:
      - LDAP_PORT_NUMBER=389
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_ROOT=dc=open-paas.org,dc=lng
    networks:
      - tcalendar-e2e

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health']
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - tcalendar-e2e

  redis:
    image: redis:latest
    networks:
      - tcalendar-e2e

  rabbitmq:
    image: rabbitmq:4.1.1-management
    networks:
      - tcalendar-e2e

  mongo:
    image: mongo:8.0.6
    networks:
      - tcalendar-e2e

  mock-smtp:
    image: linagora/mock-smtp-server:0.7
    networks:
      - tcalendar-e2e
