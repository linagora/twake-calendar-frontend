# The chaos stack of Twake Calendar: the web app (the private and the public SPAs) and its backend, 1 side service, 1
# esn-sabre and its proxy, on 3 MongoDB (a replica set), 3 OpenSearch, 3 RabbitMQ (quorum queues, autoheal), 3 Redis (a
# Redis Cluster), 1 SSO (Dex, as the e2e), 1 OpenLDAP, 1 mail catcher. Each container has a memory limit (the whole:
# ~11 GB). Every node of a replicated component is its own service (mongo1..3...): twake-chaos pauses, stops and restarts
# them one by one (topology.yaml). Published on 127.0.0.1 only: what the control scripts reach (the REST and DAV APIs
# through the proxy, the side service's WebAdmin, the SSO, the SPAs, the mail catcher's API).
#
# Service names follow the e2e stack (e2e/src/test/resources/docker-twake-calendar-e2e.yml): its proxy configuration and
# the side service's reach esn-sabre as esn_sabre, the LDAP as esn_ldap.

x-mongo: &mongo
  image: mongo:9.0.8
  mem_limit: 640m
  # the WiredTiger cache sized under the limit (its default, half the host's memory, is not the container's)
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
  healthcheck:
    test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -qx 1"]
    interval: 5s
    timeout: 10s
    retries: 60

x-opensearch: &opensearch
  image: opensearchproject/opensearch:3.10.0
  mem_limit: 1280m
  ulimits:
    nofile: {soft: 65536, hard: 65536}
  environment: &opensearch-env
    cluster.name: chaos
    discovery.seed_hosts: opensearch1,opensearch2,opensearch3
    cluster.initial_cluster_manager_nodes: opensearch1,opensearch2,opensearch3
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: -Xms640m -Xmx640m
    # the 3 nodes share the host's disk: watermarks in percent of it (85% by default) would refuse the replicas of a
    # well filled developer disk, the cluster yellow and a node down losing shards. Absolute free space instead.
    cluster.routing.allocation.disk.watermark.low: 2gb
    cluster.routing.allocation.disk.watermark.high: 1gb
    cluster.routing.allocation.disk.watermark.flood_stage: 512mb
  healthcheck:
    test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:9200/_cluster/health"]
    interval: 5s
    timeout: 10s
    retries: 120

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.2.9-management
  mem_limit: 512m
  environment:
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie twake-chaos-cookie
    RABBITMQ_CTL_ERL_ARGS: -setcookie twake-chaos-cookie
  volumes:
    - ./conf/rabbitmq/20-chaos.conf:/etc/rabbitmq/conf.d/20-chaos.conf:ro
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 5s
    timeout: 20s
    retries: 60

x-redis: &redis
  image: redis:8.12.0
  mem_limit: 256m
  entrypoint: ["/node.sh"]
  volumes:
    - ./conf/redis/node.sh:/node.sh:ro
  healthcheck:
    # -e: an error reply (LOADING, the AOF replayed after a restart) fails the check, redis-cli exits 0 on it otherwise
    test: ["CMD-SHELL", "redis-cli -e -p 6379 ping && redis-cli -e -p 6380 ping"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  # ------------------------------------------------------------------------------------------------- the application
  # The SPAs of the commit (build.sh), with the runtime configuration of the e2e: browser facing URLs http://api,
  # http://dav, https://sso:5554, http://localhost:8099 (map them with --host-resolver-rules onto the published ports)
  frontend:
    image: ${WEB_IMAGE:?}
    mem_limit: 64m
    volumes:
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/frontend/env.js:/usr/share/nginx/html/.env.js:ro
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/frontend/appList.e2e.js:/usr/share/nginx/html/appList.js:ro
    ports:
      - "127.0.0.1:${CHAOS_WEB_PORT:?}:80"

  public:
    image: ${PUBLIC_IMAGE:?}
    mem_limit: 64m
    volumes:
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/frontend/env.public.js:/usr/share/nginx/html/.env.js:ro
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/frontend/appList.e2e.js:/usr/share/nginx/html/appList.js:ro
    ports:
      - "127.0.0.1:${CHAOS_PUBLIC_PORT:?}:80"

  # The entry of the REST (Host: api) and DAV (Host: dav) APIs, with CORS (e2e/src/test/resources/nginx/default.conf)
  proxy:
    image: ${PROXY_IMAGE:?}
    mem_limit: 64m
    networks:
      default:
        aliases: [api, dav]
    ports:
      - "127.0.0.1:${CHAOS_API_PORT:?}:80"

  twake-calendar-side-service:
    image: ${SIDE_SERVICE_IMAGE:?}
    hostname: twake-calendar-side-service
    mem_limit: 1536m
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g
    volumes:
      - ${CHAOS_RUN:?}/jwt_privatekey:/root/conf/jwt_privatekey:ro
      - ${CHAOS_RUN:?}/jwt_publickey:/root/conf/jwt_publickey:ro
      - ./conf/side-service/configuration.properties:/root/conf/configuration.properties:ro
      - ./conf/side-service/opensearch.properties:/root/conf/opensearch.properties:ro
      - ./conf/side-service/rabbitmq.properties:/root/conf/rabbitmq.properties:ro
      - ./conf/side-service/redis.properties:/root/conf/redis.properties:ro
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/twake-calendar-side-service-conf/webadmin.properties:/root/conf/webadmin.properties:ro
      - ${CHAOS_REPO_DIR:?}/e2e/src/test/resources/twake-calendar-side-service-conf/logback.xml:/root/conf/logback.xml:ro
    ports:
      - "127.0.0.1:${CHAOS_WEBADMIN_PORT:?}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null 'http://localhost:8000/healthcheck/checks/Guice%20application%20lifecycle'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  # esn-sabre: the e2e's environment (SABRE_ENV=dev, as the e2e: PHP stack traces in the errors), pointed at the replica set
  sabre_dav:
    image: ${SABRE_IMAGE:?}
    hostname: esn_sabre
    mem_limit: 768m
    environment:
      SABRE_ENV: dev
      # the 3 members of the replica set (generate_config.sh prefixes mongodb://); no SABRE/ESN_MONGO_HOST: a single host
      SABRE_MONGO_URI: mongo1:27017,mongo2:27017,mongo3:27017/sabre?replicaSet=rs0
      ESN_MONGO_URI: mongo1:27017,mongo2:27017,mongo3:27017/esn_docker?replicaSet=rs0
      # no MONGO_TIMEOUT (the e2e's: 100000): the documented default, 10 s. The PHP driver monitors the replica set from
      # the request (single threaded): a hung member blocks a request for up to this connect timeout, 100 s in the e2e.
      ESN_HOST: twake-calendar-side-service
      ESN_PORT: "8080"
      # esn-sabre takes one AMQP host (generate_config.sh, AMQPPublisher): rabbitmq1, no failover to the other nodes
      AMQP_HOST: rabbitmq1
      AMQP_PORT: "5672"
      AMQP_LOGIN: guest
      AMQP_PASSWORD: guest
      SABRE_ADMIN_LOGIN: admin
      SABRE_ADMIN_PASSWORD: secret123
      OPENPASS_BASIC_AUTH: YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      LDAP_ADMIN_DN: cn=admin,dc=open-paas.org,dc=lng
      LDAP_ADMIN_PASSWORD: admin
      LDAP_BASE: ou=users,dc=open-paas.org,dc=lng
      LDAP_BASE_WITH_MAIL: ou=users,dc=open-paas.org,dc=lng
      LDAP_SERVER: ldap://esn_ldap:389
      LDAP_USERNAME_MODE: username
      LOG_TRACE: "true"
      SABRE_IMPERSONATION_ENABLED: "true"
      SABRE_EMAIL_VALARM_RECIPIENT_SCHEDULING: "true"
    volumes:
      - ${CHAOS_RUN:?}/jwt_publickey:/var/www/config/esn.key.pub:ro
    networks:
      default:
        aliases: [esn_sabre]
    healthcheck:
      # nginx and PHP-FPM answer (an anonymous request: 401)
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost/ | grep -qE '^(200|401)$$'"]
      interval: 5s
      timeout: 10s
      retries: 60

  # --------------------------------------------------------------------------------------------- the backing services
  mongo1:
    <<: *mongo
    hostname: mongo1
  mongo2:
    <<: *mongo
    hostname: mongo2
  mongo3:
    <<: *mongo
    hostname: mongo3

  opensearch1:
    <<: *opensearch
    hostname: opensearch1
    environment: {<<: *opensearch-env, node.name: opensearch1}
  opensearch2:
    <<: *opensearch
    hostname: opensearch2
    environment: {<<: *opensearch-env, node.name: opensearch2}
  opensearch3:
    <<: *opensearch
    hostname: opensearch3
    environment: {<<: *opensearch-env, node.name: opensearch3}

  rabbitmq1:
    <<: *rabbitmq
    hostname: rabbitmq1
  rabbitmq2:
    <<: *rabbitmq
    hostname: rabbitmq2
  rabbitmq3:
    <<: *rabbitmq
    hostname: rabbitmq3

  redis1:
    <<: *redis
    hostname: redis1
  redis2:
    <<: *redis
    hostname: redis2
  redis3:
    <<: *redis
    hostname: redis3

  ldap:
    image: bitnamilegacy/openldap:2.6.10
    hostname: esn_ldap
    mem_limit: 256m
    environment:
      LDAP_PORT_NUMBER: "389"
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ROOT: dc=open-paas.org,dc=lng
    volumes:
      - ./conf/ldap:/ldifs:ro
    networks:
      default:
        aliases: [esn_ldap]
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=open-paas.org,dc=lng -w admin -b ou=users,dc=open-paas.org,dc=lng -s base >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Dex (e2e/docker/Dockerfile.dex: its TLS certificate), with the password grant (conf/dex/config.yaml)
  sso:
    image: ${DEX_IMAGE:?}
    command: dex serve /etc/dex/config.yaml
    mem_limit: 128m
    environment:
      DEX_EXPAND_ENV: "false"
      DEX_SESSIONS_ENABLED: "true"
    volumes:
      - ./conf/dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      default:
        aliases: [sso]
    ports:
      - "127.0.0.1:${CHAOS_SSO_PORT:?}:5556"
      - "127.0.0.1:${CHAOS_SSO_TLS_PORT:?}:5554"

  mock-smtp:
    image: linagora/mock-smtp-server:0.7
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
    ports:
      - "127.0.0.1:${CHAOS_SMTP_API_PORT:?}:8000"
