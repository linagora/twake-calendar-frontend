# chaos: Redis Cluster, 3 masters and 3 replicas on 3 nodes (each node: the master of a third of the slots, the replica of
# a neighbour's), one node down: its replica is promoted. The e2e has no redis.properties (in memory cache and event bus):
# its presence switches the OIDC token cache and the event bus (websocket push) to Redis.
redis.topology=cluster
redisURL=redis://redis1:6379,redis://redis2:6379,redis://redis3:6379
redis.readFrom=master
