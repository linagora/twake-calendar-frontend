# chaos: a 3 node cluster, quorum queues replicated on the 3 of them (with dav.queues.quorum.bypass=true for the calendar
# queues, configuration.properties)
uri=amqp://rabbitmq1:5672
hosts=rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
management.uri=http://rabbitmq1:15672
management.user=guest
management.password=guest
quorum.queues.enable=true
quorum.queues.replication.factor=3
scheduled.consumer.reconnection.enabled=true
scheduled.consumer.reconnection.interval=60s
